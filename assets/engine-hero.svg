<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Podcast Repurposing Engine: one transcript goes in and the engine picks the best moments, then ships eight assets: four reels, a YouTube launch kit, an SEO blog, a lead magnet, an SEO audit, a trailer, B-roll research and a carousel.">
  <title>Podcast Repurposing Engine: one transcript in, a month of content out</title>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7a3a10" flood-opacity=".12"/>
    </filter>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ink { fill: #2B2B2B; } .muted { fill: #7A746B; } .accent { fill: #D2652A; }

      /* Waveform: bars breathe like live audio */
      .bar { fill: #E4793A; transform-box: fill-box; transform-origin: center; animation: wave 1.2s ease-in-out infinite; }
      @keyframes wave { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

      /* Transcript: the engine picks four moments in turn */
      .pick { opacity: 0; animation: pick 12s infinite; }
      .pick-tag { opacity: 0; animation: pick 12s infinite; }
      .p2 { animation-delay: 1.2s; } .p3 { animation-delay: 2.4s; } .p4 { animation-delay: 3.6s; }
      @keyframes pick { 0% { opacity: 0; } 4%, 80% { opacity: 1; } 88%, 100% { opacity: 0; } }

      /* Output tiles: each one checks off in sequence */
      .tile-edge { stroke: #E9E1D4; animation: edge 12s infinite; }
      .tick { opacity: 0; transform-box: fill-box; transform-origin: center; animation: tick 12s infinite; }
      .d1 { animation-delay: 4.4s; } .d2 { animation-delay: 5s; } .d3 { animation-delay: 5.6s; } .d4 { animation-delay: 6.2s; }
      .d5 { animation-delay: 6.8s; } .d6 { animation-delay: 7.4s; } .d7 { animation-delay: 8s; } .d8 { animation-delay: 8.6s; }
      @keyframes edge { 0% { stroke: #E9E1D4; } 3%, 50% { stroke: #E9A77A; } 58%, 100% { stroke: #E9E1D4; } }
      @keyframes tick { 0% { opacity: 0; transform: scale(.4); } 3% { opacity: 1; transform: scale(1.15); } 5%, 50% { opacity: 1; transform: scale(1); } 58%, 100% { opacity: 0; transform: scale(1); } }

      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .bar, .pick, .pick-tag, .tile-edge, .tick, .caret { animation: none; }
        .pick, .pick-tag, .tick { opacity: 1; } .tile-edge { stroke: #E9A77A; }
      }
    </style>
  </defs>

